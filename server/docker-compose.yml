services:
  db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: readerapp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-readerapp}
      POSTGRES_DB: readerapp
    ports:
      - "127.0.0.1:5435:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U readerapp -d readerapp"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: .
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://readerapp:${POSTGRES_PASSWORD:-readerapp}@db:5432/readerapp
    depends_on:
      db: {condition: service_healthy}
    command: sh -c "alembic upgrade head && uvicorn readerserver.api.main:app --host 0.0.0.0 --port 8000"
    ports:
      # Loopback by default; expose to the tailnet with `tailscale serve --bg 8000` (see README).
      - "${API_BIND:-127.0.0.1}:8000:8000"

  worker:
    build: .
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://readerapp:${POSTGRES_PASSWORD:-readerapp}@db:5432/readerapp
    depends_on:
      db: {condition: service_healthy}
      api: {condition: service_started}
    command: python -m readerserver.worker

volumes:
  pgdata:
